general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session || pidof hyprlock || hyprlock
    after_sleep_cmd = ~/.local/bin/screen-power on
}

# 1. Bloqueo de sesion tras 5 minutos de inactividad
listener {
    timeout = 300                                # 5 minutos: bloquea la sesion
    on-timeout = loginctl lock-session || pidof hyprlock || hyprlock
}

# 2. Apagado de pantallas 1 minuto despues del bloqueo para ahorrar energia
listener {
    timeout = 360                                # 6 minutos (1 min tras bloqueo): apaga pantallas
    on-timeout = ~/.local/bin/screen-power off
    on-resume = ~/.local/bin/screen-power on
}

# 3. Suspension profunda del sistema tras 30 minutos de inactividad
listener {
    timeout = 1800                               # 30 minutos: suspende
    on-timeout = systemctl suspend
}
